```html
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login • Kelas Kita</title>

    <link rel="stylesheet" href="style.css">
</head>


<body class="login-page">

    <main class="login-container">

        <div class="login-card">

            <div class="login-logo">
                🏫
            </div>

            <div class="badge">
                SMK • TKJ 2
            </div>

            <h1>Kelas Kita</h1>

            <p class="login-subtitle">
                Masuk untuk mengakses dashboard kelas
            </p>


            <!-- USERNAME -->

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Masukkan username"
                autocomplete="username"
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
            >


            <!-- LOGIN -->

            <button
                type="button"
                id="loginButton"
            >
                Masuk
            </button>


            <!-- DIVIDER -->

            <div class="login-divider">
                <span>atau</span>
            </div>


            <!-- GUEST -->

            <button
                type="button"
                class="guest-button"
            >
                👻 Masuk sebagai Guest
            </button>


            <!-- MESSAGE -->

            <p
                id="loginMessage"
                class="login-message"
            ></p>

        </div>

    </main>


    <!-- LOGIN SCRIPT -->

    <script src="login.js"></script>

</body>

</html>
```
