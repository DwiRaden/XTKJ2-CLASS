<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login • Kelas Kita</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-card">

            <div class="login-logo">
                🏫
            </div>

            <div class="badge">
                SMK • TKJ 2
            </div>

            <h1>Kelas Kita</h1>

            <p class="login-subtitle">
                Masuk untuk mengakses dashboard kelas
            </p>

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Masukkan username"
                autocomplete="username"
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
            >

            <button
                type="button"
                id="loginButton"
                onclick="login()"
            >
                Masuk
            </button>

            <div class="login-divider">
                <span>atau</span>
            </div>

            <button
                type="button"
                class="guest-button"
                onclick="guestLogin()"
            >
                👻 Masuk sebagai Guest
            </button>

            <p
                id="loginMessage"
                class="login-message"
            ></p>

        </div>

    </main>

    <script src="login.js"></script>

</body>
  </html>
